<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menus (PDF)</title>

    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f5f5f5;
      }

      /* Floating Back Button */
      .back-floating {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 12px 28px;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-size: 18px;
        border-radius: 999px; /* pill shape */
        z-index: 9999;
        text-decoration: none;
        cursor: pointer;
      }

      /* Scrollable PDF container */
      .pdf-wrapper {
        width: 100vw;
        height: 100vh;
        overflow-y: scroll;
        -webkit-overflow-scrolling: touch;
        background: #333;
      }

      .pdf-frame {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>

  <body>
    <!-- Floating Back Button -->
    <a class="back-floating" onclick="goBack()">← Back</a>

    <!-- Scrollable PDF Container -->
    <div class="pdf-wrapper">
      <embed src="files/Menus_All_Merged.pdf" type="application/pdf" class="pdf-frame" />
    </div>

    <script>
      function goBack() {
        if (history.length > 1) {
          history.back();
        } else {
          window.location.href = "index.html"; // change to your home page
        }
      }
    </script>
  </body>
</html>
