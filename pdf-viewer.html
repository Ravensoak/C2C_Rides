<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menus (PDF)</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .top-bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        background: #222;
        color: #fff;
      }
      .top-bar button {
        border: none;
        background: #fff;
        color: #222;
        padding: 0.35rem 0.75rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .pdf-frame {
        width: 100vw;
        height: calc(100vh - 48px);
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <button type="button" onclick="goBack()">← Back</button>
      <span>Menus (PDF)</span>
    </div>

    <iframe src="files/Menus_All_Merged.pdf" class="pdf-frame"></iframe>

    <script>
      function goBack() {
        // Prefer history if possible, otherwise go to your main page
        if (history.length > 1) {
          history.back();
        } else {
          window.location.href = "index.html"; // adjust to your home/start page
        }
      }
    </script>
  </body>
</html>
