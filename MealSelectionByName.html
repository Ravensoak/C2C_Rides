<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================================
      BASIC META / PAGE INFO
    ========================================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C2C Rides - Meal Choice by Name</title>

    <!-- =========================================================
      ICON + THEME COLOUR
    ========================================================== -->
    <link rel="icon" href="graphics/favicon-32x32.png" type="image/png" />
    <meta name="theme-color" content="#1f2a36" />

    <!-- =========================================================
      STYLESHEETS
    ========================================================== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/mealsbyname.css" />
  </head>

  <body>
    <header>
      <!-- =========================================================
        HEADER (Logo) + NAV (Loaded dynamically)
      ========================================================== -->
      <div class="pagelogo-container">
        <img src="/graphics/c2cRIDESlogoblack.png" alt="C2C Ride Logo" class="pagelogo" />
      </div>
      <!-- =========================================================
      NAVIGATION PLACEHOLDER (Loaded dynamically)
      ========================================================== -->
      <div id="nav-placeholder"></div>
    </header>

    <!-- =========================================================
      PAGE TITLE + INTRO
    ========================================================== -->
    <div class="title-with-lines">
      <!-- <hr class="fade-in delay-1"> -->
      <hr />
      <h1>Meal Choice - Name</h1>
      <hr />
    </div>

    <p class="centered-summary">Select your name to see your meal choices:</p>

    <!-- =========================================================
    NAME SELECTOR + MEAL TABLE
    ========================================================== -->
    <div class="controls">
      <select id="nameSelector">
        <option value="" disabled selected style="font-style: italic">Select name</option>
      </select>
      <!--<select id="nameSelector" onchange="updateOutput()"></select>-->
    </div>

    <div class="grid hidden">
      <div class="output" id="venue1">
        <strong class="card-title">Black Swan Pub - Fearby</strong>

        <p style="margin-bottom: 0.8rem"><em>Wednesday 23 June at 7:00pm</em></p>

        <p id="venue1starter"></p>
        <p id="venue1main"></p>
        <p id="venue1dessert"></p>

        <p id="venue1cost" class="total-line"></p>
      </div>

      <div class="output" id="venue2">
        <strong class="card-title">The Lion Hotel - Hawes</strong>

        <p style="margin-bottom: 0.8rem"><em>Thursday 24 June at 7:30pm</em></p>
        <p id="venue2starter"></p>
        <p id="venue2main"></p>
        <p id="venue2dessert"></p>

        <p id="venue2cost" class="total-line"></p>
      </div>

      <div class="output" id="venue3">
        <strong class="card-title">The Old Swan - Gargrave</strong>
        <p style="margin-bottom: 0.8rem"><em>Friday 25 June at 7:30pm</em></p>
        <p id="venue3starter"></p>
        <p id="venue3main"></p>
        <p id="venue3dessert"></p>

        <p id="venue3cost" class="total-line"></p>
      </div>

      <div class="output" id="venue4">
        <strong class="card-title">Black Sheep Brewery - Masham</strong>
        <p style="margin-bottom: 0.8rem"><em>Saturday 26 June at 7:30pm</em></p>
        <p id="venue4starter"></p>
        <p id="venue4main"></p>
        <p id="venue4dessert"></p>

        <p id="venue4cost" class="total-line"></p>
      </div>
    </div>

    <!-- =========================================================
      FOOTER PLACEHOLDER
    ========================================================== -->
    <div id="footer-placeholder"></div>

    <!-- =========================================================
      FLOATING REFRESH BUTTON (PWA only)
    ========================================================== -->
    <button id="refreshButton" title="Refresh">🔄</button>

    <!-- =========================================================
      PAGE SCRIPTS
      (defer = loads after HTML parsing, safer for DOM elements)
      ========================================================== -->
    <script src="js/mealsbyname.js" defer></script>
    <script src="js/site.js" defer></script>
  </body>
</html>
